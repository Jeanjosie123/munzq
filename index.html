<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>munzq</title>

<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

:root{
  --bg:#000000;
  --card:rgba(8,8,8,.55);
  --card2:rgba(15,15,15,.35);
  --border:rgba(255,255,255,.10);
  --blur:32px;
  --blur-strong:48px;
  --saturate:100%;

  --lime:#ffffff;
  --lime2:#d4d4d4;
  --gold:#a3a3a3;
  --blue:#737373;

  --green:#00e07a;
  --red:#ff3b5c;
  --yellow:#f0b232;
  --text:#ffffff;
  --muted:#808080;
  --discord:#5865F2;
  --white:#ffffff;
  --spotify:#1DB954;
}

html{scroll-behavior:smooth}
body{
  font-family:'Kanit','Inter',system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
  position:relative;
  padding:44px 16px 60px;
}

.bg-gif{
  position:fixed;inset:-25px;z-index:-4;
  background-image:url('https://media.tenor.com/zVwBYAc3fzUAAAAM/bmw-car.gif');
  background-size:cover;background-position:center;
  filter:blur(16px) brightness(.65) saturate(105%);
  -webkit-filter:blur(16px) brightness(.65) saturate(105%);
  opacity:.75;
  pointer-events:none;
  animation:bgPan 24s ease-in-out infinite alternate;
}
@keyframes bgPan{
  0%{transform:scale(1.06) translate(0,0)}
  50%{transform:scale(1.12) translate(-14px,-8px)}
  100%{transform:scale(1.06) translate(10px,6px)}
}

.bg-gif-overlay{
  position:fixed;inset:0;z-index:-3;pointer-events:none;
  background:
    radial-gradient(ellipse 100% 80% at 50% 30%,
      rgba(0,0,0,.20) 0%,
      rgba(0,0,0,.45) 55%,
      rgba(0,0,0,.75) 100%),
    linear-gradient(180deg,rgba(0,0,0,.25) 0%,rgba(0,0,0,.55) 100%);
}

.aurora{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none}
.aurora span{position:absolute;border-radius:50%;filter:blur(140px);opacity:.5;animation:float 18s ease-in-out infinite}
.aurora span:nth-child(1){width:520px;height:520px;background:#ffffff;top:-180px;left:-140px;opacity:.02}
.aurora span:nth-child(2){width:460px;height:460px;background:#a3a3a3;top:15%;right:-160px;animation-delay:-6s;opacity:.015}
.aurora span:nth-child(3){width:520px;height:520px;background:#525252;bottom:-200px;left:20%;animation-delay:-11s;opacity:.02}
@keyframes float{
  0%,100%{transform:translate(0,0) scale(1)}
  33%{transform:translate(60px,-50px) scale(1.12)}
  66%{transform:translate(-50px,40px) scale(.92)}
}

.grid-overlay{
  position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(ellipse 90% 65% at 50% 0%,#000 15%,transparent 78%);
  -webkit-mask-image:radial-gradient(ellipse 90% 65% at 50% 0%,#000 15%,transparent 78%);
}

.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  backdrop-filter:blur(20px) saturate(120%);
  -webkit-backdrop-filter:blur(20px) saturate(120%);
  position:relative;overflow:hidden;
  box-shadow:
    0 8px 32px -8px rgba(0,0,0,.85),
    0 0 0 1px rgba(255,255,255,.02) inset;
}
.card::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:
    linear-gradient(160deg,rgba(255,255,255,.04) 0%,transparent 40%),
    radial-gradient(circle at 100% 0%,rgba(255,255,255,.015),transparent 50%);
  opacity:.6;
}
.card::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  padding:1px;
  background:linear-gradient(160deg,rgba(255,255,255,.14) 0%,rgba(255,255,255,.02) 30%,transparent 60%);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  opacity:.6;
}
.card.glass-more{
  background:rgba(8,8,8,.45);
  backdrop-filter:blur(28px) saturate(120%);
  -webkit-backdrop-filter:blur(28px) saturate(120%);
}

.ticker{
  position:fixed;top:0;left:0;right:0;z-index:100;height:34px;
  overflow:hidden;white-space:nowrap;pointer-events:none;
}
.ticker::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.85) 0%,rgba(0,0,0,.6) 70%,rgba(0,0,0,.3) 100%);
  border-bottom:1px solid rgba(255,255,255,.05);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  mask-image:linear-gradient(180deg,#000 30%,transparent 100%);
  -webkit-mask-image:linear-gradient(180deg,#000 30%,transparent 100%);
  z-index:-1;
}
.ticker-track{
  display:inline-flex;gap:34px;
  animation:scroll 22s linear infinite;
  padding-left:100%;line-height:34px;position:relative;
}
.ticker-track span{
  font-family:'JetBrains Mono',monospace;
  font-size:11.5px;font-weight:600;letter-spacing:.4px;
  display:inline-flex;align-items:center;gap:6px;
  text-shadow:0 1px 4px rgba(0,0,0,.9);
}
.ticker-track .sym{color:var(--muted)}
.ticker-track .up{color:var(--green)}
.ticker-track .dn{color:var(--red)}
@keyframes scroll{to{transform:translateX(-100%)}}

.hero{padding:30px 22px 24px;text-align:center;position:relative;}

.view-counter{
  position:absolute;
  top:16px;
  right:16px;
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:5px 11px;
  border-radius:999px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  font-weight:600;
  letter-spacing:.5px;
  color:var(--muted);
  transition:.25s;
  z-index:5;
}
.view-counter:hover{border-color:rgba(255,255,255,.3);color:#fff}
.view-counter svg{width:13px;height:13px;color:var(--lime2);opacity:.85}
.view-counter #viewCount{color:#fff;font-weight:700;min-width:18px;text-align:center}

.avatar-ring{width:118px;height:118px;margin:0 auto 16px;position:relative}
.avatar-ring::before{
  content:"";position:absolute;inset:-4px;border-radius:50%;
  background:conic-gradient(from 0deg,#ffffff,#a3a3a3,#404040,#ffffff);
  animation:spin 5s linear infinite;filter:blur(.5px);
}
@keyframes spin{to{transform:rotate(360deg)}}
.avatar{
  position:absolute;inset:0;border-radius:50%;
  background:linear-gradient(150deg,rgba(26,26,26,.95),rgba(0,0,0,.98));
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  display:grid;place-items:center;
  font-family:'JetBrains Mono',monospace;
  font-size:34px;font-weight:700;letter-spacing:1px;
  color:#fff;border:4px solid var(--bg);
  z-index:2;overflow:hidden;
}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}

.status-dot{
  position:absolute;bottom:6px;right:6px;width:22px;height:22px;border-radius:50%;
  background:var(--green);border:4px solid var(--bg);z-index:3;
  box-shadow:0 0 14px rgba(0,224,122,.9);
  animation:pulse 2s ease-in-out infinite;
  transition:background .3s, box-shadow .3s;
}
.status-dot.online{background:#23a55a;box-shadow:0 0 14px rgba(35,165,90,.9)}
.status-dot.idle{background:#f0b232;box-shadow:0 0 14px rgba(240,178,50,.9)}
.status-dot.dnd{background:#f23f43;box-shadow:0 0 14px rgba(242,63,67,.9)}
.status-dot.offline{background:#80848e;box-shadow:0 0 14px rgba(128,132,142,.5);animation:none}
@keyframes pulse{50%{box-shadow:0 0 22px rgba(0,224,122,1)}}

.verified-badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 11px;border-radius:999px;
  background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.2);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  font-family:'JetBrains Mono',monospace;
  font-size:10.5px;font-weight:700;letter-spacing:.8px;
  color:#fff;margin-bottom:11px;text-transform:uppercase;
}
.verified-badge svg{width:12px;height:12px}

.hero h1{
  font-size:26px;font-weight:700;letter-spacing:.2px;
  background:linear-gradient(100deg,#fff 15%,#d4d4d4 55%,#808080 90%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  margin-bottom:5px;
}
.hero .handle{
  font-family:'JetBrains Mono',monospace;
  font-size:12.5px;color:var(--muted);letter-spacing:.4px;margin-bottom:12px;
}
.hero .bio{
  font-size:14px;line-height:1.75;color:#b8b8b8;font-weight:300;
  max-width:420px;margin:0 auto 20px;
}

.socials{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:4px}

.btn{
  width:48px;height:48px;border-radius:50%;flex-shrink:0;
  display:grid;place-items:center;color:#fff;text-decoration:none;cursor:pointer;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(10px) saturate(120%);
  -webkit-backdrop-filter:blur(10px) saturate(120%);
  transition:.28s cubic-bezier(.34,1.56,.64,1);
  position:relative;overflow:visible;
}
.btn svg{width:19px;height:19px;flex-shrink:0;position:relative;z-index:2}
.btn::after{
  content:attr(data-label);
  position:absolute;bottom:calc(100% + 10px);left:50%;
  transform:translateX(-50%) translateY(6px);
  padding:5px 10px;border-radius:7px;
  background:rgba(20,20,20,.95);
  border:1px solid rgba(255,255,255,.15);
  font-family:'JetBrains Mono',monospace;
  font-size:10.5px;font-weight:600;letter-spacing:.5px;
  color:#fff;white-space:nowrap;
  opacity:0;pointer-events:none;transition:.25s;z-index:10;
}
.btn:hover::after{opacity:1;transform:translateX(-50%) translateY(0)}
.btn:hover{
  transform:translateY(-3px) scale(1.06);
  background:rgba(255,255,255,.1);
  border-color:rgba(255,255,255,.35);
  box-shadow:0 8px 22px -8px rgba(255,255,255,.35);
}
.btn:active{transform:translateY(-1px) scale(.95)}

.btn.discord,.btn.tradingview,.btn.instagram,.btn.spotify{
  background:rgba(255,255,255,.04);
  border-color:rgba(255,255,255,.14);
}
.btn.discord:hover,.btn.tradingview:hover,.btn.instagram:hover,.btn.spotify:hover{
  background:rgba(255,255,255,.1);
  border-color:rgba(255,255,255,.35);
  box-shadow:0 8px 22px -8px rgba(255,255,255,.35);
}

.sec-title{
  display:flex;align-items:center;gap:9px;
  font-family:'JetBrains Mono',monospace;
  font-size:11px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;
  color:var(--muted);margin:8px 4px 0;
}
.sec-title::before{content:"//";color:#fff;font-weight:700}
.sec-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}

.perf-section{padding:0;overflow:hidden}

.tabs{
  display:flex;
  gap:4px;
  padding:14px 14px 0;
  background:transparent;
  border-bottom:1px solid var(--border);
}
.tab{
  flex:1;
  padding:11px 6px;
  border:none;
  background:transparent;
  color:var(--muted);
  font-family:'JetBrains Mono',monospace;
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.8px;
  cursor:pointer;
  border-radius:10px 10px 0 0;
  position:relative;
  transition:.22s;
  text-transform:uppercase;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.tab:hover{color:#fff;background:rgba(255,255,255,.04)}
.tab.active{
  color:#fff;
  background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02));
}
.tab.active::after{
  content:"";
  position:absolute;
  bottom:-1px;
  left:12%;
  right:12%;
  height:2px;
  background:#fff;
  border-radius:2px;
  box-shadow:0 0 12px rgba(255,255,255,.7);
}

.tab-pane{display:none;padding:20px}
.tab-pane.active{display:block;animation:fadeIn .35s cubic-bezier(.2,.8,.3,1)}
@keyframes fadeIn{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{
  padding:16px 14px;
  background:rgba(255,255,255,.025);
  border:1px solid var(--border);
  border-radius:16px;
  transition:.25s;position:relative;overflow:hidden;
  box-shadow:0 6px 24px -8px rgba(0,0,0,.7);
  cursor:pointer;
}
.stat:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.06)}
.stat:active{transform:translateY(-1px) scale(.98)}
.stat .lbl-top{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;
  color:var(--muted);margin-bottom:6px;
  display:flex;align-items:center;justify-content:space-between;
}
.stat .lbl-top .info-dot{
  font-size:9px;
  width:14px;height:14px;
  display:grid;place-items:center;
  border-radius:50%;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.15);
  color:#888;
  font-weight:700;
  opacity:.6;
  transition:.2s;
}
.stat:hover .info-dot{opacity:1;background:rgba(255,255,255,.15);color:#fff}
.stat .num{
  font-family:'JetBrains Mono',monospace;
  font-size:22px;font-weight:800;letter-spacing:-.5px;margin-bottom:4px;
}
.stat .num.lime{color:#fff}
.stat .num.green{color:var(--green)}
.stat .num.gold{color:#c8c8c8}
.stat .num.red{color:var(--red)}
.stat .sub{font-size:10.5px;color:var(--muted);font-weight:300;letter-spacing:.3px}

.cert-list{display:flex;flex-direction:column;gap:10px}
.cert-list-item{
  display:flex;gap:12px;align-items:center;
  padding:14px;border-radius:12px;
  background:linear-gradient(135deg,rgba(255,255,255,.035),rgba(255,255,255,.005));
  border:1px solid rgba(255,255,255,.1);
  cursor:pointer;transition:.22s cubic-bezier(.2,.8,.3,1);
  text-align:left;
}
.cert-list-item:hover{
  transform:translateX(4px);
  border-color:rgba(255,255,255,.35);
  background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,.015));
}
.cert-list-logo{
  width:48px;height:48px;flex-shrink:0;border-radius:10px;
  background:linear-gradient(135deg,#1a1a1a,#000);
  border:1px solid rgba(255,255,255,.25);
  display:grid;place-items:center;
  font-family:'JetBrains Mono',monospace;
  font-size:11px;font-weight:800;letter-spacing:.5px;color:#fff;
}
.cert-list-info{flex:1;min-width:0}
.cert-list-firm{
  font-family:'JetBrains Mono',monospace;
  font-size:9.5px;font-weight:700;letter-spacing:1.4px;
  color:#fff;text-transform:uppercase;margin-bottom:3px;
}
.cert-list-name{
  font-size:14px;font-weight:600;color:#fff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.cert-list-arrow{
  width:32px;height:32px;flex-shrink:0;border-radius:8px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);
  display:grid;place-items:center;color:#fff;transition:.22s;
}
.cert-list-arrow svg{width:13px;height:13px}
.cert-list-item:hover .cert-list-arrow{background:#fff;color:#000}

.chart-wrap{
  position:relative;
  width:100%;
  background:rgba(0,0,0,.35);
  border:1px solid rgba(255,255,255,.06);
  border-radius:14px;
  padding:14px 10px 8px;
  margin-bottom:14px;
}
.chart-svg{
  width:100%;
  height:auto;
  display:block;
}

.chart-tooltip{
  position: absolute;
  padding: 8px 12px;
  border-radius: 10px;
  background: rgba(8,8,8,.98);
  border: 1px solid rgba(255,255,255,.25);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: #fff;
  pointer-events: none;
  opacity: 0;
  transform: translate(-50%, -100%) translateY(-12px);
  transition: opacity .25s ease, transform .25s ease;
  z-index: 30;
  white-space: nowrap;
  box-shadow: 0 10px 28px -10px rgba(0,0,0,.95), 0 0 20px -6px rgba(0,224,122,.35);
  text-align: center;
  line-height: 1.4;
}
.chart-tooltip.show { opacity: 1; }
.chart-tooltip .ct-month {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 1.5px;
  color: #888;
  margin-bottom: 2px;
  text-transform: uppercase;
}
.chart-tooltip .ct-value {
  font-size: 14px;
  font-weight: 800;
  color: #fff;
  letter-spacing: -.3px;
}
.chart-tooltip .ct-diff {
  font-size: 9.5px;
  font-weight: 600;
  margin-top: 2px;
  letter-spacing: .3px;
}
.chart-tooltip .ct-diff.up { color: var(--green); }
.chart-tooltip .ct-diff.dn { color: var(--red); }
.chart-tooltip::after {
  content: '';
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  border: 5px solid transparent;
  border-top-color: rgba(255,255,255,.25);
}
.chart-hint-text {
  position: absolute;
  bottom: 8px;
  right: 14px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 8.5px;
  letter-spacing: 1px;
  color: #555;
  text-transform: uppercase;
  pointer-events: none;
}

.chart-hit-area {
  fill: transparent;
  cursor: pointer;
}
.chart-hit-area:hover {
  fill: rgba(0,224,122,.08);
}

#equityLine{
  stroke-dasharray:2500;
  stroke-dashoffset:2500;
}
#equityArea{
  opacity:0;
  transition:opacity .9s ease .6s;
}
#equityDot,#equityDotOuter{
  opacity:0;
  transition:opacity .5s ease 1.4s;
}
.chart-wrap.animate #equityLine{
  animation:drawLine 2.2s cubic-bezier(.4,.0,.2,1) forwards;
}
.chart-wrap.animate #equityArea{opacity:1}
.chart-wrap.animate #equityDot,
.chart-wrap.animate #equityDotOuter{opacity:1}
@keyframes drawLine{
  to{stroke-dashoffset:0}
}

.chart-mini{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:4px;
}
.chart-mini-item{
  padding:10px 8px;
  border-radius:10px;
  background:rgba(0,0,0,.35);
  border:1px solid rgba(255,255,255,.06);
  text-align:center;
}
.chart-mini-item .v{
  font-family:'JetBrains Mono',monospace;
  font-size:13px;
  font-weight:800;
  letter-spacing:-.3px;
  margin-bottom:2px;
}
.chart-mini-item .v.up{color:var(--green)}
.chart-mini-item .v.dn{color:var(--red)}
.chart-mini-item .v.nt{color:#fff}
.chart-mini-item .l{
  font-family:'JetBrains Mono',monospace;
  font-size:9px;
  letter-spacing:.6px;
  color:var(--muted);
  text-transform:uppercase;
}

.shop{padding:20px}
.product-glow{
  position:relative;
  border-radius:16px;
  padding:1.5px;
  background:linear-gradient(90deg,
    #ff0066, #ffcc00, #00ff99, #00ccff, #6633ff, #ff33cc, #ff0066, #ff0066);
  background-size:300% 100%;
  animation:rainbowSlide 4s linear infinite,
            glowPulseR 2s ease-in-out infinite alternate;
}
@keyframes rainbowSlide{
  0%{background-position:0% 50%}
  100%{background-position:300% 50%}
}
@keyframes glowPulseR{
  0%{
    box-shadow:0 0 10px rgba(255,0,102,.45),
               0 0 20px rgba(0,204,255,.25),
               0 0 30px rgba(102,51,255,.15);
  }
  100%{
    box-shadow:0 0 18px rgba(255,0,102,.75),
               0 0 36px rgba(0,204,255,.45),
               0 0 54px rgba(102,51,255,.3);
  }
}
.product-row{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  gap:14px;
  padding:14px;
  border-radius:14.5px;
  background:linear-gradient(135deg,rgba(15,15,15,.85),rgba(5,5,5,.92));
  transition:.28s cubic-bezier(.2,.8,.3,1);
  overflow: hidden;
}
.product-glow:hover .product-row{transform:translateY(-2px)}

.product-bg {
    position: absolute;
    inset: 0;
    z-index: 0;
    background-size: cover;
    background-position: center;
